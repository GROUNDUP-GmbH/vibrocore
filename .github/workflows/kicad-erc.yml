name: KiCad ERC

on:
  push:
  pull_request:

jobs:
  erc:
    # ubuntu-latest is Ubuntu 26.04. The KiCad 8.0 PPA has no release for that series.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install KiCad 8
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:kicad/kicad-8.0-releases
          sudo apt-get update
          sudo apt-get install -y kicad
      - name: Schematic ERC
        working-directory: cad/kicad/vibrocore-control
        run: kicad-cli sch erc --severity-all --exit-code-violations vibrocore-control.kicad_sch
