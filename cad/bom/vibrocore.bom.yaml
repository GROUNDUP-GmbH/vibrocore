data_issues:
  - id: legacy-row-numbers
    summary: BOM.md skips rows 9-16 and reuses rows 56-63 in Control, Geoprobe and Positioning. legacy_ref is section.row.
  - id: control-subtotal-mismatch
    summary: Control line estimates sum to EUR 1515-2420. BOM.md prints 1475-2610 in the section and 1345-2220 in the summary. Line estimates are kept.
  - id: positioning-gps-duplicate
    summary: Section 7 items 61-62 repeat the GPS antenna and ZED-F9P of section 5 items 59-60. One of each is kept on the control BOM. The positioning kit is viDoc plus the WLAN bridge. The published positioning subtotal is EUR 200-350 higher, which matches that duplicate pair.
  - id: power-psu-conflict
    summary: BOM.md specifies 48 V / 10 A. CONTROL_SYSTEM.md draws Mean Well SDR-75-48 at 1.6 A. The part follows the BOM text and does not take the diagram order code.
  - id: dc-converter-candidate
    summary: CONTROL_SYSTEM.md names Mean Well DDR-60D-24. BOM.md does not. It stays a note, not a manufacturer PN.
  - id: plc-name-in-dimensioning
    summary: DIMENSIONING.md section 9 still says CONTROLLINO or Arduino Opta. The later BOM and CONTROL_SYSTEM.md specify the WAGO PFC200 XTR.
  - id: instagrid-rental
    summary: The power rollup uses the EUR 2500 purchase price. BOM.md's low scenario is a rental and is not a stock component.
  - id: fastener-kits
    summary: Fasteners stay as the single kit lines from BOM.md. The 8x M12x40 and 6x M10 mentions in SONIC_HEAD.md are not exploded.

