data_issues:
- id: legacy-row-numbers
  summary: BOM.md skips rows 9-16 and reuses rows 56-63 in Control, Geoprobe and Positioning. legacy_ref
    is section.row.
- id: control-subtotal-mismatch
  summary: Closed 2026-11-19. BOM.md control, power and scanner totals are the YAML rollups. The old prints
    1475-2610, 1345-2220, 363-650 and 388-710 are withdrawn.
- id: positioning-gps-duplicate
  summary: Closed 2026-11-19. BOM.md section 7 no longer repeats the GPS antenna and the ZED-F9P. One of
    each stays on the control BOM. The positioning kit is viDoc plus the WLAN bridge.
- id: power-psu-conflict
  summary: Closed 2026-11-19. VC-PW-5200 is Mean Well SDR-480-48, 48 V, 10 A, 480 W. SDR-75-48 is 1.6 A
    and is not the order code. The EUR price of SDR-480-48 is unknown.
- id: dc-converter-candidate
  summary: CONTROL_SYSTEM.md previously named Mean Well DDR-60D-24. V1.1 BOM.md §8b upgrades to Mean Well
    SDR-120-24 (120 W / 5 A). VC-PW-5300 is retained as superseded history; VC-PW-5310 is the live line.
- id: plc-name-in-dimensioning
  summary: Closed 2026-11-19. DIMENSIONING.md names the WAGO PFC200 XTR. CONTROLLINO and Arduino Opta are
    not the controller.
- id: instagrid-rental
  summary: The power rollup uses the EUR 2500 purchase price. BOM.md's low scenario is a rental and is
    not a stock component.
- id: fastener-kits
  summary: Fasteners stay as the single kit lines from BOM.md. The 8x M12x40 and 6x M10 mentions in SONIC_HEAD.md
    are not exploded.
- id: gas-spring-vs-electric-tilt
  summary: 'BOM.md §3 #38 gas-spring tilt (VC-FR-4700) conflicts with §8b electric tilt (#73-75). V1.1
    firmware drives the electric tilt. VC-FR-4700 is obsolete/alternative and is not on the live frame
    BOM.'
- id: option-b-savings-v1-vs-v11
  summary: 'Realistic budget is a rounded scenario, not the YAML rollup. Option B is EUR 530 less than
    Option A for V1 (8968-8438) and EUR 680 less for V1.1 (10718-10038).'
- id: core-scanner-subtotal-mismatch
  summary: Closed 2026-11-19. The scanner subtotal is the VC-ASM-8400 rollup, EUR 429-780.
- id: sampling-concept-2026-11-19
  summary: The sampling string is the 3.25 in outer casing and cutting shoe 205449. Open tubes sit in
    the split carrier. O-ring 201325 stays, because it seals casing joints. Drive head 201385 and
    retainer 208472 are obsolete and are not on a BOM.
- id: mast-height-deficit
  summary: The 1500 mm profile is unchanged. The study layout in docs/engineering/MAST-LAYOUT.md and
    cad/export/layout/mast-stack.svg computes the deficit for one 1219.2 mm casing plus the head, the
    shoe and the adapter. Shoe length, adapter length, carriage height and ground clearance are TBD.
- id: se050-double-count
  summary: Closed 2026-11-19. VC-CT-6410 is obsolete. The SE050 breakout is inside VC-CT-6400 and is not a
    second purchase.
- id: rut241-9v-converter
  summary: Closed 2026-11-19. VC-CT-6620 is obsolete. The RUT241 input is 9-30 V DC. The router runs from
    the 24 V rail.
