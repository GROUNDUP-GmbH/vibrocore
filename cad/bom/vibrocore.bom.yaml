  legacy_ref: '2.97'
  unknowns:
  - Bore is unknown. The chain shaft diameter is still 25-30 mm.
  - Supply voltage and output circuit must match 750-637. The exact interface is not frozen.
  - Order code is unknown.
  - Price is unknown.
  notes: 'GVL_IO maps %IW4 and %IW5 to this encoder. GVL_PARAMS uses 671.9 counts per mm from
    (1000 x 4 x 40) / (15 x 15.875). The factor 40 is the gearbox ratio, so that scale fits a motor-shaft
    encoder. A chain-shaft encoder is (1000 x 4) / (15 x 15.875) = 16.80 counts per mm. FB_HubControl
    reads the drive position, not the 750-637 words. Do not change 671.9 in this revision.'
