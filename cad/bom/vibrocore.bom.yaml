# Vibrocore V1 engineering BOM. Single source for part numbers, revisions,
# quantities and the estimates copied from docs/engineering/BOM.md (2026-03-26).
# Estimates are unit costs. A published line total is unit cost times BOM qty.
# Unknown dimensions are omitted; they are listed under unknowns, not invented.
schema_version: 1

meta:
  owner: Ground UP GmbH
  currency: EUR
  length_unit: mm
  mass_unit: kg
  steel_density_kg_m3: 7850
  cad_baseline_date: "2026-11-04"
  source_bom: docs/engineering/BOM.md
  source_bom_date: "2026-03-26"
  drawing_standard: "ISO 7200 title block, ISO 5457 A3, ISO 128 first angle"
  odooplm_repository: https://github.com/OmniaGit/odooplm
  odooplm_branch: "19.0"
  odooplm_commit: b9db89248c206fd61bd38191d7a5289c58ce8a54
  odooplm_module_version: "plm 19.0.1.0.50, plm_engineering 19.0.1.0.1, plm_automate_normal_bom 19.0.1.0.0"
  engineering_state: draft
  internal_reference: "default_code equals engineering_code. Do not enable plm_auto_internalref before import."

