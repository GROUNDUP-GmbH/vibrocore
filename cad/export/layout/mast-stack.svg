<text x="168" y="42" font-size="3.2" font-family="sans-serif" font-weight="700">Dimension chain</text>
<text x="168" y="48.0" font-size="2.35" font-family="sans-serif">Required height = ground clearance + shoe + casing + adapter + head</text>
<text x="168" y="51.5" font-size="2.35" font-family="sans-serif">+ carriage + top margin.</text>
<text x="168" y="55.0" font-size="2.35" font-family="sans-serif">ground_clearance: 50.0 mm TBD. Station 50.0 mm. TBD placeholder</text>
<text x="168" y="58.5" font-size="2.35" font-family="sans-serif">shoe: 80.0 mm TBD. Station 130.0 mm. TBD placeholder. Outside</text>
<text x="168" y="62.0" font-size="2.35" font-family="sans-serif">diameter is documented.</text>
<text x="168" y="65.5" font-size="2.35" font-family="sans-serif">casing: 1219.2 mm. Station 1349.2 mm. 48 in casing, VC-GP-7100</text>
<text x="168" y="69.0" font-size="2.35" font-family="sans-serif">adapter: 60.0 mm TBD. Station 1409.2 mm. TBD placeholder, VC-SH-1500</text>
<text x="168" y="72.5" font-size="2.35" font-family="sans-serif">head: 232.0 mm. Station 1641.2 mm. shaft 200.0 + flange 12.0 TBD +</text>
<text x="168" y="76.0" font-size="2.35" font-family="sans-serif">plate 20.0 + motor height not in the stack</text>
<text x="168" y="79.5" font-size="2.35" font-family="sans-serif">carriage: 80.0 mm TBD. Station 1721.2 mm. TBD placeholder. Plate</text>
<text x="168" y="83.0" font-size="2.35" font-family="sans-serif">thickness is 10 mm and is not this term.</text>
<text x="168" y="86.5" font-size="2.35" font-family="sans-serif">top_margin: 40.0 mm TBD. Station 1761.2 mm. TBD placeholder</text>
<text x="168" y="90.0" font-size="2.35" font-family="sans-serif">Required total: 1761.2 mm.</text>
<text x="168" y="93.5" font-size="2.35" font-family="sans-serif">Available mast stroke: 1300.0 mm.</text>
<text x="168" y="97.0" font-size="2.35" font-family="sans-serif">Deficit against stroke: 461.2 mm.</text>
<text x="168" y="100.5" font-size="2.35" font-family="sans-serif">Mast profile: 1500.0 mm. Length unchanged.</text>
<text x="168" y="104.0" font-size="2.35" font-family="sans-serif">Deficit against profile: 261.2 mm.</text>
<text x="168" y="107.5" font-size="2.35" font-family="sans-serif">Documented lengths alone, TBD set to 0: 1439.2 mm.</text>
<text x="168" y="111.0" font-size="2.35" font-family="sans-serif">Documented lengths minus the profile: -60.8 mm.</text>
<text x="168" y="114.5" font-size="2.35" font-family="sans-serif">Plate opening assumption: 1473.0 mm. SAMPLING remainder: 33.8 mm.</text>
<text x="168" y="118.0" font-size="2.35" font-family="sans-serif">The SAMPLING remainder is not this chain. It omits carriage, shoe,</text>
<text x="168" y="121.5" font-size="2.35" font-family="sans-serif">adapter and margins.</text>
<text x="168" y="125.0" font-size="2.35" font-family="sans-serif">Head uses column shaft 200 mm and plate 20 mm, plus the flange</text>
<text x="168" y="128.5" font-size="2.35" font-family="sans-serif">placeholder.</text>
<text x="168" y="132.0" font-size="2.35" font-family="sans-serif">Motor height 175 mm is not in the head. The motors sit left and</text>
<text x="168" y="135.5" font-size="2.35" font-family="sans-serif">right of the rod.</text>
<text x="168" y="139.0" font-size="2.35" font-family="sans-serif">Casing OD 82.55 mm. Casing ID 66.675 mm. Shoe OD 87.63 mm.</text>
<text x="168" y="142.5" font-size="2.35" font-family="sans-serif">Dashed segments are TBD. Do not manufacture from this sheet.</text>
<rect x="248" y="230" width="152" height="52" fill="#fff" stroke="#111" stroke-width="0.4"/>
