<text x="18" y="22" font-size="3.2" font-family="sans-serif">ISO 7200 title block · ISO 5457 A3 · not released for manufacture</text>
<text x="20" y="32" font-size="2.7" font-family="sans-serif">Rittal AX 1181.000. 800 x 1000 x 400 mm. IP66. T3 287.5 mm.</text>
<text x="20" y="35.6" font-size="2.7" font-family="sans-serif">Study model. Do not manufacture from this sheet.</text>
<text x="20" y="39.2" font-size="2.7" font-family="sans-serif">No chain-encoder gland. No 48 V rail. Two 24 V slots. PNOZ s4 space is reserved.</text>
<text x="20" y="42.800000000000004" font-size="2.7" font-family="sans-serif">Option A rail 150.6 mm. Option B fits that rail.</text>
<text x="20" y="46.400000000000006" font-size="2.7" font-family="sans-serif">Sealed area 2.288 m2. Capacity at 10 K is 125.8 W.</text>
<text x="20" y="50.00000000000001" font-size="2.7" font-family="sans-serif">Closed heat 118.7 W, about 49.4 C.</text>
<text x="20" y="53.60000000000001" font-size="2.7" font-family="sans-serif">SDR-480-24 ceiling 149.3 W, about 51.9 C. Rating is open.</text>
<text x="20" y="57.20000000000001" font-size="2.7" font-family="sans-serif">The fan is not fitted. STO inverter order and actuator current are open.</text>
<text x="20" y="60.80000000000001" font-size="2.7" font-family="sans-serif">Mount on the idle-side mk 51.04 upright. Door faces the service side. Not in the machine pose.</text>
