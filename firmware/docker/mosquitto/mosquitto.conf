# Mosquitto MQTT Broker — Vibrocore V1
# Target: WAGO PFC200 XTR (runs in Docker)
#
# Authentication is mandatory. Create a password file on the device:
#   mosquitto_passwd -c /mosquitto/config/passwd vibrocore
# Do not commit real passwords. See passwd.example and acl.example.

# ── Listeners (internal Docker network only — no 0.0.0.0 host publish) ──
# Plain MQTT for Node-RED and CODESYS clients on the vibrocore network
listener 1883
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# WebSocket MQTT — authenticated; only expose if an HMI client needs it
listener 9001
protocol websockets
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Bind to all interfaces inside the container; host port mapping is omitted
# in docker-compose so only the internal Docker network can reach 1883/9001.
# If you must publish to the HMI LAN, bind the host side to a specific IP:
#   "192.168.1.10:1883:1883"  — never 0.0.0.0 in the field.

# ── Persistence ────────────────────────────────────────────────────
persistence true
persistence_location /mosquitto/data/
autosave_interval 300

# ── Logging ────────────────────────────────────────────────────────
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ── Retained messages ──────────────────────────────────────────────
# Status topics are retained so a new HMI connection immediately
# shows current machine state without waiting for next publish.
# Topics: vibrocore/status/#  vibrocore/cycle/#
# (retained flag is set by the publisher — no broker config needed)

# ── Bridge to RDDL / cloud ─────────────────────────────────────────
# Uncomment and fill in your RDDL MQTT endpoint when available.
# Requires TLS certificate in /mosquitto/config/certs/.
#
# connection rddl-bridge
# address mqtt.rddl.io:8883
# topic vibrocore/cycle/# out 1 "" rddl/vibrocore/
# bridge_cafile /mosquitto/config/certs/rddl-ca.crt
# bridge_certfile /mosquitto/config/certs/client.crt
# bridge_keyfile  /mosquitto/config/certs/client.key
# cleansession true
# keepalive_interval 60
