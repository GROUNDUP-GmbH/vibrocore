# Mosquitto MQTT Broker — Vibrocore V1
# Target: WAGO PFC200 XTR (runs in Docker)

# ── Listeners ──────────────────────────────────────────────────────
# Plain MQTT — accessible on WAGO LAN (Node-RED, CODESYS MQTT client)
listener 1883
protocol mqtt
allow_anonymous true

# WebSocket MQTT — for browser-based live data (future use)
listener 9001
protocol websockets
allow_anonymous true

# ── Persistence ────────────────────────────────────────────────────
persistence true
persistence_location /mosquitto/data/
autosave_interval 300

# ── Logging ────────────────────────────────────────────────────────
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ── Retained messages ──────────────────────────────────────────────
# Status topics are retained so a new HMI connection immediately
# shows current machine state without waiting for next publish.
# Topics: vibrocore/status/#  vibrocore/cycle/#
# (retained flag is set by the publisher — no broker config needed)

# ── Bridge to RDDL / cloud ─────────────────────────────────────────
# Uncomment and fill in your RDDL MQTT endpoint when available.
# Requires TLS certificate in /mosquitto/config/certs/.
#
# connection rddl-bridge
# address mqtt.rddl.io:8883
# topic vibrocore/cycle/# out 1 "" rddl/vibrocore/
# bridge_cafile /mosquitto/config/certs/rddl-ca.crt
# bridge_certfile /mosquitto/config/certs/client.crt
# bridge_keyfile  /mosquitto/config/certs/client.key
# cleansession true
# keepalive_interval 60
